<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src file:; img-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>她</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.1); --accent: #4d6bfe; --ok: #2f855a; --warn: #b7791f; --bad: #d14343; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1f; --card: #26262b; --text: #f2f2f4; --muted: #a1a1a8; --line: rgba(255,255,255,.12); --ok: #48bb78; --warn: #ecc94b; --bad: #fc8181; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    header { display: flex; gap: 4px; padding: 12px 16px 0; }
    header button { border: none; background: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
    header button.on { background: var(--card); color: var(--text); font-weight: 600; }
    main { padding: 12px 16px 20px; }
    .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    h2 { font-size: 14px; margin: 0 0 6px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 9px; font: inherit; }
    textarea { min-height: 170px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > div { flex: 1; }
    .row > div.narrow { flex: 0 0 90px; }
    button.primary { margin-top: 10px; border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 16px; cursor: pointer; font: inherit; }
    button.small { border: 1px solid var(--line); background: none; color: var(--text); border-radius: 6px; padding: 1px 8px; cursor: pointer; font: inherit; font-size: 12px; white-space: nowrap; }
    ul { list-style: none; margin: 4px 0 0; padding: 0; }
    li { display: flex; gap: 6px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: none; }
    li .grow { flex: 1; min-width: 0; word-break: break-word; }
    .tag { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
    .tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); } .tag.bad { color: var(--bad); }
    .muted { color: var(--muted); } .error { color: var(--bad); } .saved { color: var(--ok); }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .clip { background: var(--card); border-radius: 10px; padding: 6px; }
    .clip video { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; border-radius: 6px; display: block; }
    .clip select, .clip input { margin-top: 5px; font-size: 12px; padding: 4px 6px; }
    .clip .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .clip.off video { opacity: .35; }
    .bar { position: sticky; top: 0; background: var(--bg); padding: 6px 0 10px; z-index: 1; display: flex; gap: 10px; align-items: center; }
    .bar button.primary { margin-top: 0; }
    .photo { position: relative; user-select: none; cursor: crosshair; line-height: 0; margin-top: 8px; }
    .photo img { width: 100%; display: block; border-radius: 6px; }
    .photo .box { position: absolute; border: 2px solid var(--accent); background: rgba(77,107,254,.15); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
    .photo .view { position: absolute; border: 2px dashed rgba(255,255,255,.85); pointer-events: none; }
    ul.fit { margin: 6px 0 0; font-size: 12px; }
    ul.fit li { display: list-item; border: none; padding: 1px 0; }
    ol.steps { margin: 6px 0 0; padding-left: 20px; }
    ol.steps li { display: list-item; border: none; padding: 2px 0; }
  </style>
</head>
<body>
  <header>
    <button data-tab="persona">人设</button>
    <button data-tab="memory">她记得的事</button>
    <button data-tab="clips">画面</button>
    <button data-tab="scene">做场景</button>
  </header>
  <main id="content"><p class="muted">正在问她……</p></main>
  <script src="panel.js"></script>
</body>
</html>
