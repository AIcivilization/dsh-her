<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src file:; img-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>她</title>
  <style>
    :root { --her-w: 300px; --her-h: 400px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    body.window { background: #1b1b1f; }
    /* Moving between scenes: the old one fades out, every page fades in. */
    body { animation: appear 0.7s ease-out; transition: opacity 0.6s ease-in; }
    body.leaving { opacity: 0; }
    @keyframes appear { from { opacity: 0; } }
    #stage { position: absolute; left: 50%; bottom: 0; width: var(--her-w); height: var(--her-h); transform: translateX(-50%); }
    body.wallpaper #stage { left: auto; transform: none; right: 3vw; bottom: 6vh; height: 42vh; width: auto; aspect-ratio: var(--her-aspect, 0.75); }
    /* Scene packs: the whole window is the scene, the empty plate behind the clips. */
    body.scene { background: var(--plate) center / cover no-repeat; }
    body.scene #stage { inset: 0; left: 0; width: auto; height: auto; transform: none; aspect-ratio: auto; }
    /* With its own plate the scene fills the screen; a picture without one is shown whole, never cut. */
    body.scene.plate video, body.scene.plate canvas { object-fit: cover; }
    body.scene:not(.plate) { background: #000; }
    body.scene #bubble { left: 6vw; right: auto; width: 32vw; bottom: 45vh; justify-content: flex-start; }
    /* A full-screen photo with her clips over one region of it (layoutScene in main.ts sets the boxes). */
    body.region { background: #000; }
    #plate, #plate-fill { position: absolute; display: none; pointer-events: none; }
    body.region #plate { display: block; }
    /* The photo shrunk to show her whole (screen shape far from the photo's): a blurred copy fills the edges. */
    #plate-fill { inset: -60px; width: auto; height: auto; object-fit: cover; filter: blur(36px) brightness(0.8); }
    body.region.fill #plate-fill { display: block; }
    body.region #stage { inset: auto; transform: none; aspect-ratio: auto;
      --feather: 3%;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--feather), #000 calc(100% - var(--feather)), transparent), linear-gradient(to bottom, transparent, #000 var(--feather), #000 calc(100% - var(--feather)), transparent);
      -webkit-mask-composite: source-in; mask-composite: intersect; }
    body.region video, body.region canvas { object-fit: cover; }
    body.region.scene #bubble { right: auto; width: 30vw; justify-content: flex-start; }
    /* Being touched: separate translate/rotate/scale, so whatever transform places her in the window stays. */
    #stage.touch-head { animation: touch-head 0.42s ease-out; transform-origin: 50% 100%; }
    #stage.touch-body { animation: touch-body 0.4s ease-out; transform-origin: 50% 100%; }
    #stage.touch-long { animation: touch-long 1.4s ease-in-out; transform-origin: 50% 100%; }
    @keyframes touch-head { 30% { translate: 0 1.6%; scale: 1.015 0.985; } 65% { translate: 0 -0.8%; } }
    @keyframes touch-body { 25% { rotate: -1.6deg; } 55% { rotate: 1.2deg; } 80% { rotate: -0.4deg; } }
    @keyframes touch-long { 30% { rotate: -1.4deg; translate: 0 0.6%; } 70% { rotate: 1.4deg; translate: 0 0.6%; } }
    @media (prefers-reduced-motion: reduce) { #stage.touch-head, #stage.touch-body, #stage.touch-long { animation: none; } }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.3s linear; pointer-events: none; }
    video.on, canvas.on { opacity: 1; }
    /* A hard cut: the anchor frames match, so the swap must not blend. */
    video.cut, canvas.cut { transition: none; }
    /* Decoding source of a stacked clip; its canvas is what shows. */
    video.source { width: 1px; height: 1px; opacity: 0 !important; }

    /* No look yet: a drawn stand-in (no pictures), until one is imported on the "她" page. */
    #empty { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
    body.empty #empty { display: flex; }
    #empty .face { width: min(46vw, 150px); aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 30%, #ffd9e6, #b69cff 70%); box-shadow: 0 8px 30px rgba(120, 90, 200, 0.35);
      color: #fff; font-size: min(18vw, 60px); font-weight: 600; animation: breathe 4s ease-in-out infinite; }
    #empty p { margin: 0; padding: 6px 12px; border-radius: 10px; background: rgba(28, 26, 34, 0.82); color: #f4f0fa; font-size: 13px; text-align: center; max-width: 90%; }
    @keyframes breathe { 50% { transform: scale(1.04); } }
    #bubble { position: absolute; left: 12px; right: 12px; bottom: calc(var(--her-h) * 0.9); display: flex; justify-content: center;
      opacity: 0; transform: translateY(6px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
    body.wallpaper #bubble { left: auto; right: 3vw; width: calc(42vh * 0.75 + 4vw); bottom: calc(6vh + 42vh * 0.9); }
    #bubble.show { opacity: 1; transform: none; }
    body.no-bubble #bubble { display: none; }
    /* With the talk bar open the conversation is there: nothing over her head as well. */
    body.bar-open #bubble { display: none; }
    #bubble p { position: relative; margin: 0; max-width: 100%; max-height: calc(var(--her-h) * 0.36); overflow: hidden; padding: 11px 15px 12px; border-radius: 18px;
      background: var(--her-bar-bg, rgba(24, 26, 38, 0.88)); color: var(--her-bar-text, #f2f3f8); font-size: 15px; line-height: 1.6; letter-spacing: 0.01em;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.28), 0 0 0 1px color-mix(in srgb, var(--her-bar-accent, #7fb2ff) 34%, transparent);
      -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
      display: flex; flex-direction: column-reverse; gap: 2px;
      /* Older sentences fade out at the top instead of being cut mid-line. */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px); mask-image: linear-gradient(to bottom, transparent 0, #000 22px); }
    /* A short answer needs no fade: the whole bubble shows, with a small tail towards her. */
    #bubble p:not(:has(span + span + span)) { -webkit-mask-image: none; mask-image: none; }
    #bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px; rotate: 45deg; border-radius: 0 0 3px 0;
      background: var(--her-bar-bg, rgba(24, 26, 38, 0.88)); box-shadow: 1px 1px 0 color-mix(in srgb, var(--her-bar-accent, #7fb2ff) 34%, transparent); }
    body.scene #bubble::after, body.wallpaper #bubble::after { display: none; }
    #bubble p span.cut { opacity: 0.6; }
    /* What she heard you say: small, above her answer. */
    #bubble p span.heard { align-self: flex-start; max-width: 100%; margin-bottom: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12.5px;
      color: color-mix(in srgb, var(--her-bar-text, #f2f3f8) 78%, transparent); background: color-mix(in srgb, var(--her-bar-text, #f2f3f8) 12%, transparent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* At her feet while the pointer is on her: hold to talk, or type. */
    #ctl { position: absolute; left: 50%; bottom: 10px; display: none; gap: 8px; padding: 5px; border-radius: 999px; translate: -50% 6px; opacity: 0;
      background: var(--her-bar-bg, rgba(24, 26, 38, 0.86)); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), 0 0 0 1px color-mix(in srgb, var(--her-bar-accent, #7fb2ff) 34%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: opacity 0.18s, translate 0.18s; pointer-events: none; }
    body.overlay #ctl { display: flex; }
    body.overlay.empty #ctl { bottom: 2px; }
    #ctl.show { opacity: 1; translate: -50% 0; pointer-events: auto; }
    body.bar-open #ctl { display: none; }
    #ctl button { width: 34px; height: 34px; padding: 0; border: none; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      color: var(--her-bar-text, #f2f3f8); background: color-mix(in srgb, var(--her-bar-text, #f2f3f8) 12%, transparent); transition: background 0.12s, transform 0.12s; touch-action: none; }
    #ctl button:hover { background: color-mix(in srgb, var(--her-bar-text, #f2f3f8) 22%, transparent); }
    #ctl button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #ctl button.on { background: #e5484d; color: #fff; transform: scale(1.1); box-shadow: 0 0 0 5px rgba(229, 72, 77, 0.28); }

    /* Listening: a soft dot at her feet. */
    #mic { position: absolute; left: 50%; bottom: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
      background: #ff6b8a; box-shadow: 0 0 10px 3px rgba(255, 107, 138, 0.6); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    #mic.on { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
    #mic.speech { background: #7cf0b0; box-shadow: 0 0 12px 4px rgba(124, 240, 176, 0.7); }
    @keyframes pulse { 50% { transform: scale(1.35); } }
    body.wallpaper #mic { left: auto; right: calc(3vw + 42vh * 0.375); bottom: calc(6vh - 14px); }
    #bubble.thinking p::after { content: '…'; display: inline-block; animation: dots 1.2s steps(4, end) infinite; width: 1.4em; overflow: hidden; vertical-align: bottom; }
    @keyframes dots { from { width: 0; } to { width: 1.4em; } }

      background: rgba(28, 26, 34, 0.9); color: #fff; font: inherit; font-size: 14px; outline: none; user-select: text; }
  </style>
</head>
<body>
  <img id="plate-fill" alt="">
  <img id="plate" alt="">
  <div id="stage"></div>
  <div id="empty"><div class="face">她</div><p>还没有外形：去 dsh 的「她」页面导入一个，或者在形象工坊里做一个</p></div>
  <div id="bubble"><p></p></div>
  <div id="mic"></div>
  <div id="ctl">
    <button id="ctl-mic" type="button" title="按住说话，松开发出去（她在头顶回答）" aria-label="按住说话"><svg viewBox="0 0 20 20"><rect x="7.5" y="3" width="5" height="9" rx="2.5"/><path d="M5 10a5 5 0 0 0 10 0M10 15v2.5"/></svg></button>
    <button id="ctl-type" type="button" title="打字给她（她在小条里回答）" aria-label="打字给她"><svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M5.5 8h.01M8.5 8h.01M11.5 8h.01M14.5 8h.01M6.5 12h7"/></svg></button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
