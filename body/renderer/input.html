<!doctype html>
<!-- Typing to her while she lives in the wallpaper: that window takes no keys, so this small one does (body/main/index.ts). -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>和她说</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 14px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    form { padding: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #b69cff; background: rgba(28, 26, 34, 0.96); color: #fff; font: inherit; outline: none; }
    p { margin: 6px 4px 0; padding: 4px 10px; border-radius: 8px; background: rgba(28, 26, 34, 0.96); color: #ffb4b4; }
    p:empty { display: none; }
  </style>
</head>
<body>
  <form id="ask"><input id="text" autocomplete="off" autofocus placeholder="想和她说点什么…（回车发送，Esc 关闭）"><p id="note"></p></form>
  <script>
    const text = document.getElementById('text')
    const note = document.getElementById('note')
    document.getElementById('ask').addEventListener('submit', async event => {
      event.preventDefault()
      const said = text.value.trim()
      if (said === '') return window.close()
      if (await window.her.say(said)) return window.close()
      note.textContent = '她现在连不上 dsh，等一下再试'
    })
    text.addEventListener('keydown', event => { if (event.key === 'Escape') window.close() })
    window.addEventListener('blur', () => { if (text.value.trim() === '') window.close() })
  </script>
</body>
</html>
