<!doctype html>
<!-- 真人桌宠's small settings window; with nobody yet, where her 设计包 is dropped (docs/独立安装包设计.md). -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:">
  <title>真人桌宠</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --soft: #667085; --line: #e3e6ec; --blue: #2f6fed; --warn: #b54708; --warn-bg: #fff4e5; --bad: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17191e; --card: #20232a; --ink: #e8eaf0; --soft: #9aa3b2; --line: #30343d; --blue: #6b9bff; --warn: #f5b76b; --warn-bg: #3a2c14; --bad: #ff8a80; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    main { padding: 16px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    h2 { font-size: 13px; color: var(--soft); font-weight: 600; margin: 18px 0 6px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row > .grow { flex: 1; min-width: 0; }
    .row small, p.note { color: var(--soft); font-size: 12px; display: block; }
    p.note { margin: 6px 2px; }
    button { font: inherit; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    button.main { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.plain { border: 0; background: none; color: var(--blue); padding: 5px 4px; }
    button:disabled { opacity: .5; cursor: default; }
    select, input[type=time] { font: inherit; padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 44px 16px; text-align: center; background: var(--card); }
    .drop.over { border-color: var(--blue); }
    .drop b { font-size: 16px; display: block; margin-bottom: 6px; }
    .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
    .bad { color: var(--bad); }
    .licence { font-weight: 600; }
    img.cover { width: 100%; border-radius: 10px; display: block; margin-bottom: 10px; }
    ul { margin: 4px 0; padding-left: 20px; }
    .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .tag { font-size: 12px; color: var(--soft); border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; }
  </style>
</head>
<body>
  <main id="page"></main>
  <script src="settings.js"></script>
</body>
</html>
